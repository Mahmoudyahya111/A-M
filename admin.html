async function bizLoad(){const[os,ls,ps]=await Promise.all([all('orders'),all('ledger'),all('products')]);return{os,ls,ps};}
function biz(d,f,t){
  const inR=x=>{const k=iso(x);return k>=f&&k<=t;},del=d.os.filter(o=>o.status==='delivered'&&inR(o.delivered_at||o.created_at)),placed=d.os.filter(o=>inR(o.created_at)),led=d.ls.filter(l=>inR(l.entry_date));
  const purchases=sum(led.filter(l=>l.kind==='purchase'),'amount'),expenses=sum(led.filter(l=>l.kind==='expense'),'amount'),other=sum(led.filter(l=>l.kind==='other_income'),'amount');
  const rev=sum(del,'total'),n=del.length,items=o=>Array.isArray(o.items)?o.items:[],units=del.reduce((s,o)=>s+items(o).reduce((a,x)=>a+(+x.qty||1),0),0),ship=sum(del,'delivery_fee'),gross=rev-purchases,refunds=sum(d.os.filter(o=>o.refund_status==='refunded'&&o.refunded_at&&inR(o.refunded_at)),'refund_amount'),net=gross-expenses+other-refunds;

  const dd=del.filter(o=>o.delivered_at).map(o=>(new Date(o.delivered_at)-new Date(o.created_at))/864e5),fulfil=dd.length?dd.reduce((a,b)=>a+b,0)/dd.length:null;
  const cust={};del.forEach(o=>{const k=o.user_id||o.email||o.phone;if(!k)return;(cust[k]=cust[k]||{name:o.customer_name||o.email,n:0,spend:0}).n++;cust[k].spend+=+o.total||0;});
  const hist={};d.os.filter(o=>o.status==='delivered'&&iso(o.delivered_at||o.created_at)<=t).forEach(o=>{const k=o.user_id||o.email||o.phone;if(k)hist[k]=(hist[k]||0)+1;});
  const buyers=Object.keys(cust),repeat=buyers.length?buyers.filter(k=>hist[k]>1).length/buyers.length:null;
  const mo={},mk=(k)=>mo[k]=mo[k]||{m:k,rev:0,pur:0,exp:0};del.forEach(o=>mk(iso(o.delivered_at||o.created_at).slice(0,7)).rev+=+o.total||0);led.forEach(l=>{if(l.kind==='purchase')mk(iso(l.entry_date).slice(0,7)).pur+=+l.amount;else if(l.kind==='expense')mk(iso(l.entry_date).slice(0,7)).exp+=+l.amount;});

  const cat={};led.filter(l=>l.kind!=='other_income').forEach(l=>{const k=(l.category||'Uncategorised')+'|'+l.kind,p=cat[k]=cat[k]||{c:l.category||'Uncategorised',kind:l.kind==='purchase'?'Purchase':'Expense',a:0};p.a+=+l.amount;});
  const live=d.ps.filter(p=>!p.archived),gpo=n?gross/n:0;
  return {f,t,refunds,canc:d.os.filter(o=>o.status==='cancelled'&&o.cancelled_at&&inR(o.cancelled_at)),rev,net,gross,n,units,ship,purchases,expenses,other,aov:n?rev/n:0,cpo:n?(purchases+expenses)/n:0,nm:rev?net/rev:null,gm:rev?gross/rev:null,placed:placed.length,cancelled,cr:placed.length?cancelled/placed.length:null,
   open:open.length,cod:sum(open.filter(o=>o.payment_status!=='awaiting'&&o.payment_status!=='received'),'total'),awaiting:sum(open.filter(o=>o.payment_status==='awaiting'),'total'),fulfil,repeat,buyers:buyers.length,
   be:gpo>0?Math.ceil(expenses/gpo):null,invUnits:sum(live,'stock'),invValue:live.reduce((s,p)=>s+(+p.stock||0)*(+p.price||0),0),
   months:Object.values(mo).sort((x,y)=>x.m.localeCompare(y.m)),prods:Object.values(prod).sort((x,y)=>y.r-x.r),pay:Object.values(pay).sort((x,y)=>y.r-x.r),cats:Object.values(cat).sort((x,y)=>y.a-x.a),

function bizHtml(B,P){const dl=(a,b)=>{const g=gr(a,b);return g==null?'':`<small style="color:${g>=0?'#2ecc71':'#e74c3c'}">${g>=0?'▲':'▼'} ${Math.abs(Math.round(g*100))}% vs previous</small>`;},k2=(t,v,s)=>`<div class="card" style="flex:1;min-width:160px;margin:0"><small>${t}</small><h3 style="margin:4px 0 2px">${v}</h3>${s||''}</div>`,R=(...x)=>`<div class="row" style="gap:12px;margin-bottom:12px;align-items:stretch">${x.join('')}</div>`,E=x=>x==null?'-':fm(x)+' EGP';

   tbl(['Month','Revenue','Purchases','Expenses','Net profit'],B.months.map(m=>[m.m,fm(m.rev),fm(m.pur),fm(m.exp),fm(m.rev-m.pur-m.exp)]))+

function bizSpec(B,P){const E=x=>x==null?'-':fm(x)+' EGP',D=(a,b)=>{const r=gr(a,b);return r==null?'':(r>=0?'+':'')+Math.round(r*100)+'% vs previous period';};
  return{file:'telegant-business-report-'+B.t,title:'Business Report',subtitle:B.f+' to '+B.t,kpis:[['Revenue',E(B.rev),D(B.rev,P.rev)],['Net profit',E(B.net),D(B.net,P.net)],['Net margin',B.nm==null?'-':pct(B.nm),'after materials and expenses'],['Gross margin',B.gm==null?'-':pct(B.gm),'sales minus materials'],['Orders delivered',String(B.n),D(B.n,P.n)],['Average order value',E(B.aov),D(B.aov,P.aov)],['Units sold',String(B.units)],['Cost per order',E(B.cpo)],['Orders in progress',String(B.open)],['Cash to collect on delivery',E(B.cod)],['Awaiting InstaPay',E(B.awaiting)],['Cancellation rate',B.cr==null?'-':pct(B.cr)],['Avg days to deliver',B.fulfil==null?'-':B.fulfil.toFixed(1)],['Repeat customers',B.repeat==null?'-':pct(B.repeat)],['Orders to cover expenses',B.be==null?'-':String(B.be)],['Stock value',E(B.invValue),fm(B.invUnits)+' units'],['Refunds paid',E(B.refunds)],['Cancelled orders',String(B.canc.length)]],

  if(d.ca){const[i,v]=d.ca.split('|');return done(await sb.from('categories').update({active:v==='1'}).eq('id',i));}
  if(d.cd&&await TG.ask('Delete this category (and its sub-categories)? Products stay, but lose the category.')){
    const c=(await sb.from('categories').select('slug').eq('id',d.cd).single()).data;const r=await sb.from('categories').delete().eq('id',d.cd);
    if(!r.error&&c)await sb.from('pages').delete().eq('slug','c-'+c.slug);return done(r);}
  if(t.id==='addSec'){$('#gsec').insertAdjacentHTML('beforeend',secHtml('',''));return;}
  if(d.rmsec){t.closest('.sec').remove();return;}
  if(t.id==='cancelEd'){PE=null;return show('Pages');}
  if(d.pe){PE=+d.pe;return show('Pages');}
  if(d.pc){PF=String(d.pc);return show('Products');}
  if(d.pm){const[i,v]=d.pm.split('|');return done(await sb.from('pages').update({in_menu:v==='1'}).eq('id',i));}
  if(t.id==='savePage'){const T=$('#pgT').value,ti=$('#gt').value.trim(),row={title:ti,title_ar:$('#gta').value.trim()||null,template:T,in_menu:$('#gm').checked,published:true};
    if(!ti)return alert('Enter a page title.');t.disabled=true;
    try{
      if(PE){const secs=[...document.querySelectorAll('#gsec .sec')].map(s=>({h:s.querySelector('.gsh').value.trim(),p:s.querySelector('.gsb').value.trim()})).filter(s=>s.h||s.p);
        const r=await sb.from('pages').update({title:ti,title_ar:row.title_ar,in_menu:row.in_menu,content:JSON.stringify({sections:secs})}).eq('id',PE);if(r.error)throw r.error;PE=null;alert('Page saved.');return show('Pages');}
      if(T==='shop'){const cr={name_en:ti,name_ar:row.title_ar,parent_id:$('#gpar').value||null,slug:slug(ti)};
        let r=await sb.from('categories').insert(cr).select().single();if(r.error&&r.error.code==='23505'){cr.slug+='-'+Math.floor(Math.random()*900+100);r=await sb.from('categories').insert(cr).select().single();}if(r.error)throw r.error;
        Object.assign(row,{kind:'category',target:r.data.slug,slug:'c-'+r.data.slug});const g=await sb.from('pages').insert(row);if(g.error)throw g.error;
        if(await TG.ask('Page created. Add products to it now?')){PF=String(r.data.id);return show('Products');}return show('Pages');}
      if(T==='product'){let pr;const sid=$('#gps').value;
        if(sid){pr=(await sb.from('products').select('*').eq('id',+sid).single()).data;}
        else{if(!$('#gpp').value)throw new Error('Enter a price for the new product.');const f=$('#gpi').files[0],prod={name_en:ti,name_ar:row.title_ar,price:+$('#gpp').value,stock:parseInt($('#gpst').value)||0,category_id:$('#gpc').value||null,slug:slug(ti),image_url:f?await upImg(f,'new'):null};
          let r=await sb.from('products').insert(prod).select().single();if(r.error&&r.error.code==='23505'){prod.slug+='-'+Math.floor(Math.random()*900+100);r=await sb.from('products').insert(prod).select().single();}if(r.error)throw r.error;pr=r.data;}
        Object.assign(row,{kind:'product',target:pr.slug,slug:'p-'+pr.slug});const g=await sb.from('pages').insert(row);if(g.error)throw g.error;alert('Product page created.');return show('Pages');}
      const secs=[...document.querySelectorAll('#gsec .sec')].map(s=>({h:s.querySelector('.gsh').value.trim(),p:s.querySelector('.gsb').value.trim()})).filter(s=>s.h||s.p);
      Object.assign(row,{kind:'custom',slug:slug(ti),content:JSON.stringify({sections:secs})});const g=await sb.from('pages').insert(row);if(g.error)throw g.error;alert('Page created.');return show('Pages');
    }catch(e){alert(e.code==='23505'?'A page with this name already exists.':(e.message||e));}finally{t.disabled=false;}return;}
  if(d.rs&&await TG.ask('Send a password reset email to '+d.rs+'?')){const r=await sb.auth.resetPasswordForEmail(d.rs,{redirectTo:new URL('login.html',location.href).href});return alert(r.error?r.error.message:'Reset link sent to '+d.rs+'.');}
  if(d.ad){const r=await sb.from('orders').select('customer_name,phone,address,created_at,order_number').eq('user_id',d.ad).order('created_at',{ascending:false}),seen={},L=[];
    (r.data||[]).forEach(o=>{const k=String(o.address||'').toLowerCase().replace(/\\s+/g,' ').trim()+'|'+o.phone;if(!seen[k]){seen[k]={o,n:0};L.push(seen[k]);}seen[k].n++;});
    $('#adrBox').innerHTML=`<div class="card"><h3>Saved addresses - ${esc(d.who)}</h3>`+(L.length?L.map(x=>`<p style="margin:8px 0"><b>${esc(x.o.address)}</b><br><small>${esc(x.o.customer_name)} · ${esc(x.o.phone)} · ${x.n} order${x.n>1?'s':''} · last used ${new Date(x.o.created_at).toLocaleDateString()}</small></p>`).join(''):'<p>No orders yet, so no saved address.</p>')+`<button class="b" data-closeadr="1">Close</button></div>`;
    window.scrollTo({top:0,behavior:'smooth'});return;}
  if(d.closeadr){$('#adrBox').innerHTML='';return;}
  if(d.pg){const[i,v]=d.pg.split('|');return done(await sb.from('pages').update({published:v==='1'}).eq('id',i));}
  if(d.pgd&&await TG.ask('Delete this page?'))return done(await sb.from('pages').delete().eq('id',d.pgd));
  if('pu' in d){const tr=t.closest('tr'),id=t.parentElement.dataset.pid;
    const price=+val(tr,'price'),sale=val(tr,'sale')===''?null:+val(tr,'sale');
    if(sale!==null&&sale>=price)return alert('Offer price must be lower than the normal price.');
    const upd={price,category_id:val(tr,'cat')||null,stock:parseInt(val(tr,'stock'))||0,sale_price:sale,offer_label:sale===null?null:(val(tr,'label')||null),offer_ends_at:sale===null?null:(val(tr,'ends')||null)};
    const f=tr.querySelector('[name=file]').files[0];
    if(f){const path=`${id}-${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
      const u=await sb.storage.from('product-images').upload(path,f);if(u.error)return alert(u.error.message);
      upd.image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;}
    return done(await sb.from('products').update(upd).eq('id',id));}
  if('ro' in d)return done(await sb.from('products').update({sale_price:null,offer_label:null,offer_ends_at:null}).eq('id',t.parentElement.dataset.pid));
  if(d.pr!==undefined)return done(await sb.from('products').update({archived:d.pr==='1'}).eq('id',t.parentElement.dataset.pid));
  if(t.id==='addR')return done(await sb.from('reviews').insert({kind:'review',author:$('#ra').value,rating:+$('#rr').value||null,body:$('#rb').value,visible:true}));
  if(d.rv){const[i,v]=d.rv.split('|');return done(await sb.from('reviews').update({visible:v==='1'}).eq('id',i));}
  if(d.rd&&await TG.ask('Delete this?'))return done(await sb.from('reviews').delete().eq('id',d.rd));});

$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.tg_theme=n};
$('#out').onclick=async()=>{await TG.signOut();location.href='login.html'};
(async()=>{me=await TG.profile();
  if(!me||me.role!=='owner'||me.status!=='approved'){location.replace('login.html');return;}
  $('#who').textContent=me.email;
  $('#nav').innerHTML=Object.keys(TABS).map(n=>`<button>${n}</button>`).join('');
  $('#nav').onclick=e=>e.target.tagName==='BUTTON'&&show(e.target.textContent);show('Analytics');})();
</script></body></html>
