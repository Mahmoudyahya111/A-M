<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Admin | TELEGANT</title>
<script>try{var t=localStorage.tg_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="tg-theme.css">
<style>
:root{--ink:#2a2114;--card:rgba(255,252,244,.86);--line:rgba(160,120,40,.3);--gold:#b8892f}
html[data-tg-theme=dark]{--ink:#f1e9d6;--card:rgba(24,19,12,.86);--line:rgba(232,207,134,.25);--gold:#e8cf86}
body{margin:0;font:14px/1.5 system-ui,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font:600 18px Georgia,serif;flex:1}
nav{display:flex;gap:6px;padding:12px 20px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--ink)}
nav button,.b{padding:7px 12px;border:1px solid var(--line);background:none;border-radius:8px;cursor:pointer}
nav .on,.b.p{background:var(--gold);color:#16110a;border-color:var(--gold)}
main{padding:0 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
input,select{padding:7px;border:1px solid var(--line);border-radius:6px;background:transparent;margin:0 6px 6px 0}
td input{width:90px}
.row{display:flex;flex-wrap:wrap;align-items:center}
h3{margin:0 0 10px;font:600 16px Georgia,serif}
.tag{padding:2px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px}
</style></head><body>
<header><img src="MEBG-GOLDEN.png" alt="TELEGANT" style="height:44px"><b>Admin</b>
<span id="who"></span><button class="b" id="th">Light / dark</button><button class="b" id="out">Sign out</button></header>
<nav id="nav"></nav><main id="v">Loading…</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="tg-core.js"></script>
<script>
const $=s=>document.querySelector(s),sb=TG.sb,ST=['new','obtaining material','cutting','assembling','adding product photo','ready for pickup','on the way to manufacturer','picked up','on the way to customer','arrived at customer','delivered','cancelled'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tbl=(h,r)=>`<div class="card"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Nothing yet.</td></tr>`}</table></div>`;
const val=(tr,n)=>tr.querySelector(`[name=${n}]`).value;
let me;const slug=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('x-'+Date.now());
const clabel=(c,all)=>{const p=all.find(x=>x.id===c.parent_id);return (p?p.name_en+' › ':'')+c.name_en;};
const DR={f:new Date(Date.now()-29*864e5).toISOString().slice(0,10),t:new Date().toISOString().slice(0,10)};
const dur=s=>{s=Math.round(+s||0);return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m'};
const cairo=t=>t?new Date(t).toLocaleString('en-GB',{timeZone:'Africa/Cairo',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const kpi=(t,v)=>`<div class="card" style="flex:1;min-width:150px;margin:0"><small>${t}</small><h3 style="margin:4px 0 0">${v}</h3></div>`;
const rangeBar=tab=>`<div class="card"><div class="row"><label>From <input id="df" type="date" value="${DR.f}"></label><label>To <input id="dt" type="date" value="${DR.t}"></label><button class="b p" id="applyD" data-tab="${tab}">Show</button></div></div>`;
const stars=n=>n?'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n))+' '+n:'-';
const PDOT={available:['#2ecc71','Available'],break:['#f39c12','On break'],offline:['#95a5a6','Offline']};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const R=['owner','manufacturer','delivery','support','customer'];
const fm=n=>Number(n||0).toLocaleString('en-EG',{maximumFractionDigits:0});
const sum=(a,k)=>(a||[]).reduce((t,r)=>t+Number(r[k]||0),0);
async function all(t,f){let o=[],i=0;for(;;){let q=sb.from(t).select('*');if(f)q=f(q);const{data}=await q.order('id').range(i,i+999);o=o.concat(data||[]);if(!data||data.length<1000)return o;i+=1000;}}
const PM={cod:'Cash on delivery',instapay_now:'InstaPay - paid now',instapay_delivery:'InstaPay - pay at delivery'};
const SR={f:'',t:''};
const itemParts=a=>(Array.isArray(a)?a:[]).map(x=>{const d=x.sizeDetail||{},sz=(x.size==='Custom'||d.label==='Custom')?`Custom (chest ${d.chest}, length ${d.length}, shoulder ${d.shoulder} cm)`:(x.size||'');return `${x.qty||1} x ${x.name||x.color||'item'}${sz?' / '+sz:''} @ ${fm(x.price)}`;});
async function statement(){const[os,ls]=await Promise.all([all('orders',q=>q.eq('status','delivered')),all('ledger')]),rows=[];
  os.forEach(o=>rows.push({date:String(o.delivered_at||o.created_at).slice(0,10),ref:o.order_number,type:'Order',desc:`${o.customer_name||''} - ${itemParts(o.items).join('; ')}${o.express?' - express +'+fm(o.delivery_fee):''} - ${PM[o.payment_method]||o.payment_method}`,debit:0,credit:+o.total||0}));
  ls.forEach(l=>{const out=l.kind!=='other_income';rows.push({date:String(l.entry_date),ref:'LDG-'+l.id,type:l.kind==='purchase'?'Purchase':l.kind==='expense'?'Expense':'Other income',desc:[l.category,l.supplier,l.description].filter(Boolean).join(' - '),debit:out?+l.amount:0,credit:out?0:+l.amount});});
  rows.sort((x,y)=>x.date.localeCompare(y.date)||x.ref.localeCompare(y.ref));let b=0;rows.forEach(r=>{b+=r.credit-r.debit;r.bal=b;});return rows;}
async function stmtSection(){const rows=await statement(),f=SR.f,t=SR.t,before=f?rows.filter(r=>r.date<f):[],open=before.length?before[before.length-1].bal:0,
  v=rows.filter(r=>(!f||r.date>=f)&&(!t||r.date<=t)),inn=sum(v,'credit'),out=sum(v,'debit'),close=v.length?v[v.length-1].bal:open;
  return `<div class="card"><h3>Statement</h3><p><small>Money in = completed (delivered) orders. Money out = purchases and expenses. Balance runs like a bank statement.</small></p>
   <div class="row"><label>From <input id="sf" type="date" value="${esc(f)}"></label><label>To <input id="stt" type="date" value="${esc(t)}"></label><button class="b p" id="applyS">Show</button><button class="b" id="clearS">All time</button></div>
   <p>Opening balance <b>${fm(open)}</b> &nbsp;·&nbsp; Money in <b>${fm(inn)}</b> &nbsp;·&nbsp; Money out <b>${fm(out)}</b> &nbsp;·&nbsp; Closing balance <b>${fm(close)} EGP</b></p></div>`+
   tbl(['Date','Reference','Type','Description','Money out','Money in','Balance'],v.map(r=>[esc(r.date),esc(r.ref),esc(r.type),esc(r.desc),r.debit?fm(r.debit):'',r.credit?fm(r.credit):'',fm(r.bal)]));}

const TABS={
 async Analytics(){const{data}=await sb.from('page_stats').select('*').order('views',{ascending:false});
  return `<p>Last 30 days. "Engaged" = stayed 15s or scrolled. "Left without engaging" = viewed but did neither.</p>`+
   tbl(['Page','Views','Unique visitors','Engaged','Left without engaging','Clicked out of site'],
   (data||[]).map(r=>[esc(r.page),r.views,r.visitors,r.engaged,Math.max(r.sessions-r.engaged,0),r.exits]));},
 async Orders(){const[{data},ip]=await Promise.all([sb.from('orders').select('*').order('created_at',{ascending:false}).limit(300),sb.from('site_settings').select('value').eq('key','instapay').maybeSingle()]);
  const ipCard=`<div class="card"><h3>InstaPay account shown to customers</h3><div class="row"><input id="ipv" style="min-width:260px" placeholder="your InstaPay address or phone" value="${esc((ip.data&&ip.data.value&&ip.data.value.handle)||'')}"><button class="b p" id="saveIP">Save</button></div></div>`;
  return ipCard+tbl(['Order','Customer','Items','Shipping','Payment','Total','Status'],(data||[]).map(o=>{const aw=o.payment_status==='awaiting';
   return [`<b>${esc(o.order_number)}</b><br><small>${new Date(o.created_at).toLocaleString()}<br>Deliver by ${esc(o.delivery_date||'-')}</small>`,
   `${esc(o.customer_name)}<br><small>${esc(o.phone)}<br>${esc(o.email||'')}<br>${esc(o.address||'')}</small>`,
   itemParts(o.items).map(esc).join('<br>')||'-',
   o.express?`<span class="tag">Express</span><br><small>+${fm(o.delivery_fee)} EGP</small>`:'Standard<br><small>no fee</small>',
   esc(PM[o.payment_method]||o.payment_method)+'<br>'+(aw?`<span class="tag" style="border-color:#c0392b;color:#c0392b">Pending payment confirmation</span><br><small>Transfer ref: <b>${esc(o.payment_ref||'-')}</b></small><br>${o.payment_proof?`<button class="b" data-pf="${esc(o.payment_proof)}">View transfer proof</button> `:''}<button class="b p" data-cp="${o.id}">Confirm payment received</button>`:o.payment_status==='received'?'<span class="tag">Payment received</span>'+(o.payment_ref?`<br><small>Ref: ${esc(o.payment_ref)}</small>`:''):'<small>Collected on delivery</small>'),
   `<b>${fm(o.total)} EGP</b><br><small>items ${fm(o.subtotal??o.total)}${+o.delivery_fee?' + shipping '+fm(o.delivery_fee):''}</small>`,
   `<select data-st="${o.id}"${aw?' data-aw="1"':''}>${ST.map(s=>`<option${s===o.status?' selected':''}>${s}</option>`).join('')}</select>`+(aw?'<br><small>On hold: manufacturer cannot see it until payment is confirmed</small>':'')];}));},
 async Users(){const{data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
  return `<div class="card"><h3>Add user (manufacturer, delivery, support or another owner)</h3><div class="row">
   <input id="ue" type="email" placeholder="Email"><input id="up" type="text" placeholder="Password (8+)">
   <select id="ur"><option>manufacturer</option><option>delivery</option><option>support</option><option>owner</option></select><button class="b p" id="addU">Add user</button></div></div>`+
   tbl(['Email','Name','Role','Status','Joined','Actions'],(data||[]).map(u=>[esc(u.email),esc(u.full_name),u.id===me.id?esc(u.role):`<select data-role="${u.id}">${R.map(x=>`<option${x===u.role?' selected':''}>${x}</option>`).join('')}</select>`,`<span class="tag">${esc(u.status)}</span>`,
   new Date(u.created_at).toLocaleDateString(),u.id===me.id?'(you)':
   (u.status!=='approved'?`<button class="b" data-ap="${u.id}">Approve</button> `:'')+(u.status==='pending'?`<button class="b" data-rj="${u.id}">Reject</button> `:'')+`<button class="b" data-del="${u.id}">Remove</button>`]));},
 async Products(){const[{data},{data:cats}]=await Promise.all([sb.from('products').select('*').order('id'),sb.from('categories').select('*').order('name_en')]);
  const co=v=>'<option value="">No category</option>'+(cats||[]).slice().sort((x,y)=>clabel(x,cats).localeCompare(clabel(y,cats))).map(c=>`<option value="${c.id}"${String(c.id)===String(v)?' selected':''}>${esc(clabel(c,cats))}</option>`).join('');
  return `<div class="card"><h3>Add product</h3><div class="row"><input id="pn" placeholder="Name (EN)"><input id="pa" placeholder="Name (AR)">
   <input id="pp" type="number" placeholder="Price EGP"><input id="ps" type="number" min="0" placeholder="Stock"><select id="pc">${co('')}</select><input id="pi" placeholder="Image URL (or upload after adding)"><button class="b p" id="addP">Add</button></div></div>`+
   `<p>Pick a new picture and press Save to replace the current one. Offer = fill the offer price (lower than the price), then Save. Remove offer clears it.</p>`+
   tbl(['Product','Category','Price (EGP)','Stock','Offer','Picture','Actions'],(data||[]).map(p=>[`<b>${esc(p.name_en)}</b>${p.name_ar?`<br><small>${esc(p.name_ar)}</small>`:''}${p.archived?'<br><span class="tag">archived</span>':''}${p.stock<=0?'<br><span class="tag">out of stock</span>':''}`,
   `<select name="cat">${co(p.category_id)}</select>`,`<input name="price" type="number" min="0" value="${esc(p.price)}">`,`<input name="stock" type="number" min="0" value="${esc(p.stock)}">`,
   `<input name="sale" type="number" min="0" placeholder="Offer price" value="${esc(p.sale_price??'')}"><br><input name="label" placeholder="Label e.g. -15%" value="${esc(p.offer_label||'')}"><br><input name="ends" type="date" style="width:140px" value="${esc(p.offer_ends_at||'')}">`,
   `<img src="${esc(p.image_url||'')}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px"><input name="file" type="file" accept="image/*" style="width:150px">`,
   `<span data-pid="${p.id}"><button class="b p" data-pu>Save</button> <button class="b" data-ro>Remove offer</button> <button class="b" data-pr="${p.archived?0:1}">${p.archived?'Restore':'Archive'}</button></span>`]));},
 async Accounting(){const[m,l,op]=await Promise.all([sb.from('accounting_monthly').select('*').order('m',{ascending:false}),
   sb.from('ledger').select('*').order('entry_date',{ascending:false}).limit(200),
   sb.from('orders').select('id',{count:'exact',head:true}).not('status','in','(delivered,cancelled)')]);
  const mm=m.data||[],rev=sum(mm,'revenue'),cost=sum(mm,'costs'),k=(t,v)=>`<div class="card" style="flex:1;min-width:150px;margin:0"><small>${t}</small><h3 style="margin:4px 0 0">${v}</h3></div>`;
  const stmtHtml=await stmtSection();
  return `<div class="row" style="gap:12px;margin-bottom:16px;align-items:stretch">${k('Revenue (delivered orders)',fm(rev)+' EGP')}${k('Purchases + expenses',fm(cost)+' EGP')}${k('Profit',fm(rev-cost)+' EGP')}${k('Margin',rev?Math.round((rev-cost)/rev*100)+'%':'-')}${k('Orders in progress',op.count??0)}</div>
   <div class="card"><h3>Add purchase / expense / income</h3><div class="row"><input id="ld" type="date" value="${new Date().toISOString().slice(0,10)}">
   <select id="lk"><option value="purchase">Purchase (material)</option><option value="expense">Expense</option><option value="other_income">Other income</option></select>
   <input id="lc" placeholder="Category"><input id="ls" placeholder="Supplier"><input id="lx" placeholder="Description"><input id="la" type="number" min="0" placeholder="Amount EGP"><button class="b p" id="addL">Add</button></div></div>
   <div class="row" style="gap:8px;margin-bottom:12px"><button class="b p" data-xl="statement">Export statement (.xlsx)</button><button class="b" data-xl="sales">Export orders (.xlsx)</button><button class="b" data-xl="ledger">Export purchases/expenses (.xlsx)</button><button class="b" data-xl="monthly">Export monthly summary (.xlsx)</button></div>`+stmtHtml+
   tbl(['Month','Revenue','Costs','Profit'],mm.map(r=>[esc(String(r.m).slice(0,7)),fm(r.revenue),fm(r.costs),fm(r.revenue-r.costs)]))+
   tbl(['Date','Type','Category','Supplier','Description','Amount',''],(l.data||[]).map(r=>[esc(r.entry_date),esc(r.kind),esc(r.category),esc(r.supplier),esc(r.description),fm(r.amount),`<button class="b" data-ld="${r.id}">Delete</button>`]));},
 async Categories(){const[{data},{data:prods}]=await Promise.all([sb.from('categories').select('*').order('name_en'),sb.from('products').select('id,name_en,category_id').order('id')]);
  const d=data||[],tops=d.filter(c=>!c.parent_id),sorted=d.slice().sort((x,y)=>clabel(x,d).localeCompare(clabel(y,d)));
  const assign=d.length?`<div class="card"><h3>Put products in a category</h3><div class="row"><select id="ac">${sorted.map(c=>`<option value="${c.id}">${esc(clabel(c,d))}</option>`).join('')}</select></div>
   <div class="row">${(prods||[]).map(p=>{const c=d.find(x=>x.id===p.category_id);return `<label style="margin:0 16px 8px 0"><input type="checkbox" name="ap" value="${p.id}" style="margin:0 6px 0 0;padding:0;border:0"> ${esc(p.name_en)}${c?` <small>(${esc(clabel(c,d))})</small>`:''}</label>`;}).join('')}</div>
   <button class="b p" id="assignC">Put selected products in this category</button></div>`:'';
  return `<div class="card"><h3>Add category / sub-category</h3><div class="row"><input id="cn" placeholder="Name (EN) e.g. Summer clothes"><input id="ca" placeholder="Name (AR)"><select id="cp"><option value="">Main category</option>${tops.map(c=>`<option value="${c.id}">Sub-category of: ${esc(c.name_en)}</option>`).join('')}</select><button class="b p" id="addC">Add</button></div></div>`+assign+
  tbl(['Name','Level','Status','Actions'],d.map(c=>[esc(c.name_en)+(c.name_ar?` <small>${esc(c.name_ar)}</small>`:''),c.parent_id?'Sub of '+esc((d.find(x=>x.id===c.parent_id)||{}).name_en):'Main',`<span class="tag">${c.active?'active':'off'}</span>`,
  `<button class="b" data-ca="${c.id}|${c.active?0:1}">${c.active?'Deactivate':'Activate'}</button> <button class="b" data-cd="${c.id}">Delete</button>`]));},
 async Pages(){const{data}=await sb.from('pages').select('*').order('created_at',{ascending:false});
  const url=p=>p.kind==='category'?'catalog.html?c='+p.target:p.kind==='product'?'catalog.html?p='+p.target:'catalog.html?page='+p.slug;
  return `<div class="card"><h3>Add a text page</h3><div class="row"><input id="gt" placeholder="Page title"><textarea id="gc" placeholder="Page text" style="min-width:260px;min-height:60px;margin:0 6px 6px 0;padding:7px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit"></textarea><button class="b p" id="addPg">Add page</button></div></div>
   <p>Category pages use the shop template and product pages use the product template. They are created automatically when you add a category or a product.</p>`+
  tbl(['Title','Type','Link','Status','Actions'],(data||[]).map(p=>[esc(p.title),esc(p.kind),`<a href="${esc(url(p))}" target="_blank" style="color:var(--gold)">${esc(url(p))}</a>`,`<span class="tag">${p.published?'published':'hidden'}</span>`,
  `<button class="b" data-pg="${p.id}|${p.published?0:1}">${p.published?'Unpublish':'Publish'}</button>`+(p.kind==='custom'?` <button class="b" data-pgd="${p.id}">Delete</button>`:'')]));},
 async Chat(){const[a1,b1]=await Promise.all([sb.from('site_settings').select('value').eq('key','chat_enabled').maybeSingle(),sb.from('site_settings').select('value').eq('key','chat_schedule').maybeSingle()]);
  const on=!!(a1.data&&a1.data.value.on),sc=(b1.data&&b1.data.value)||{mode:'always',days:{}};
  return `<div class="card"><h3>Live chat</h3><p>Master switch: when OFF the chat never shows. When ON it follows the opening hours below (Cairo time).</p>
   <div class="row"><button class="b ${on?'p':''}" id="chatSw" data-on="${on?1:0}">Chat widget: ${on?'ON':'OFF'}</button>
   <select id="schMode"><option value="always"${sc.mode!=='schedule'?' selected':''}>Always open (when ON)</option><option value="schedule"${sc.mode==='schedule'?' selected':''}>Only during opening hours</option></select>
   <a class="b" href="chat-admin.html" style="text-decoration:none;color:var(--ink)">Open support console</a></div></div>
   <div class="card"><h3>Opening hours</h3><table style="min-width:420px"><tr><th>Day</th><th>Open</th><th>From</th><th>To</th></tr>${DAYS.map((n,i)=>{const d=(sc.days||{})[i]||{on:i!==5,from:'10:00',to:'18:00'};
   return `<tr><td>${n}</td><td><input type="checkbox" data-day="${i}" ${d.on?'checked':''} style="width:auto;padding:0;border:0"></td><td><input type="time" data-from="${i}" value="${d.from||'10:00'}"></td><td><input type="time" data-to="${i}" value="${d.to||'18:00'}"></td></tr>`}).join('')}</table>
   <p><button class="b p" id="saveSch">Save opening hours</button></p></div>`;},
 async Satisfaction(){const r=await sb.rpc('csat_report',{p_from:DR.f,p_to:DR.t});if(r.error)return rangeBar('Satisfaction')+`<div class="card">${esc(r.error.message)}</div>`;
  const d=r.data,mx=Math.max(1,...[1,2,3,4,5].map(n=>+((d.dist||{})[n])||0)),
   bars=[5,4,3,2,1].map(n=>{const c=+((d.dist||{})[n])||0;return `<div class="row" style="gap:8px;flex-wrap:nowrap"><span style="width:34px">${n} ★</span><div style="flex:1;background:var(--line);border-radius:6px;height:12px"><div style="width:${c/mx*100}%;background:var(--gold);height:12px;border-radius:6px"></div></div><span style="width:34px;text-align:right">${c}</span></div>`}).join('');
  return rangeBar('Satisfaction')+`<div class="row" style="gap:12px;margin-bottom:16px;align-items:stretch">${kpi('Average rating',d.avg_rating?d.avg_rating+' / 5':'-')}${kpi('Survey response rate',d.closed?Math.round(d.rated/d.closed*100)+'%':'-')}${kpi('Chats',d.total)}${kpi('Avg first response',d.avg_frt?dur(d.avg_frt):'-')}${kpi('Avg chat length',d.avg_dur?dur(d.avg_dur):'-')}</div>
   <div class="card"><h3>Rating distribution</h3>${bars}</div><p><button class="b" data-xr="csat">Export (.xlsx)</button></p>`+
   tbl(['Agent','Chats','Rated','Avg rating','Avg first response'],(d.by_agent||[]).map(x=>[esc(x.name),x.chats,x.rated,stars(x.avg),x.frt?dur(x.frt):'-']))+
   tbl(['Day','Chats','Avg rating'],(d.by_day||[]).map(x=>[esc(x.day),x.chats,stars(x.avg)]))+
   tbl(['Chat no.','Customer','Rating','Comment','Handled by','Closed'],(d.recent||[]).map(x=>[esc(x.code),esc(x.customer),stars(x.rating),esc(x.feedback||''),esc(x.agent||''),cairo(x.at)]));},
 async Agents(){const r=await sb.rpc('agent_report',{p_from:DR.f,p_to:DR.t});if(r.error)return rangeBar('Agents')+`<div class="card">${esc(r.error.message)}</div>`;const d=r.data;
  return rangeBar('Agents')+`<p><button class="b" data-xr="agents">Export (.xlsx)</button></p>`+
   tbl(['Agent','Now','First login','Last logout','Online','Available','On break','Breaks','Chats','Avg rating'],(d.agents||[]).map(x=>[esc(x.name)+` <small>${esc(x.role)}</small>`,`<span style="color:${PDOT[x.status][0]}">●</span> ${PDOT[x.status][1]}`,cairo(x.first_login),cairo(x.last_logout),dur(x.online_s),dur(x.available_s),dur(x.break_s),x.breaks,x.chats,stars(x.avg_rating)]))+
   tbl(['Agent','Break started','Break ended','Length'],(d.breaks||[]).map(x=>[esc(x.name),cairo(x.start),x.end?cairo(x.end):'still on break',dur(x.secs)]))+
   tbl(['Agent','Logged in','Logged out','Length'],(d.logins||[]).map(x=>[esc(x.name),cairo(x.in),x.out?cairo(x.out):'online now',dur(x.secs)]));},
 async Reviews(){const{data}=await sb.from('reviews').select('*').order('created_at',{ascending:false});
  return `<div class="card"><h3>Add review</h3><div class="row"><input id="ra" placeholder="Name"><input id="rr" type="number" min="1" max="5" placeholder="Stars 1-5">
   <input id="rb" placeholder="Review text" style="min-width:240px"><button class="b p" id="addR">Add</button></div></div>`+
   tbl(['Type','Author','Rating','Text','Shown on site','Actions'],(data||[]).map(r=>[esc(r.kind),esc(r.author),r.rating||'',esc(r.body),r.visible?'yes':'no',
   `<button class="b" data-rv="${r.id}|${r.visible?0:1}">${r.visible?'Hide':'Show'}</button> <button class="b" data-rd="${r.id}">Delete</button>`]));}
};

async function show(n){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.textContent===n));
  $('#v').innerHTML=await TABS[n]();$('#v').dataset.tab=n;}
const done=(r,n)=>{if(r&&r.error)alert(r.error.message||r.error);show(n||$('#v').dataset.tab)};

$('#v').addEventListener('change',async e=>{const id=e.target.dataset.st;
  if(id){if(e.target.dataset.aw&&!confirm('Payment is not confirmed yet. Move this order anyway?')){show('Orders');return;}const r=await sb.rpc('set_order_status',{p_order:+id,p_status:e.target.value});if(!r.error)sb.functions.invoke('swift-action',{body:{action:'status',order_id:+id}});done(r);}});
$('#v').addEventListener('change',async e=>{const t=e.target;if(!t.dataset.role)return;
  if(!confirm('Change this user\'s role to '+t.value+'?')){show('Users');return;}
  done(await sb.from('profiles').update({role:t.value,status:'approved'}).eq('id',t.dataset.role));});
$('#v').addEventListener('click',async e=>{const t=e.target,d=t.dataset;if(!t.closest('button'))return;
  if(t.id==='applyD'){DR.f=$('#df').value;DR.t=$('#dt').value;return show(d.tab);}
  if(t.id==='chatSw'){const r=await sb.from('site_settings').upsert({key:'chat_enabled',value:{on:d.on!=='1'}});if(r.error)return alert(r.error.message);return show('Chat');}
  if(t.id==='saveSch'){const days={};DAYS.forEach((n,i)=>{days[i]={on:document.querySelector(`[data-day="${i}"]`).checked,from:document.querySelector(`[data-from="${i}"]`).value||'10:00',to:document.querySelector(`[data-to="${i}"]`).value||'18:00'};});
    const r=await sb.from('site_settings').upsert({key:'chat_schedule',value:{mode:$('#schMode').value,days}});if(r.error)return alert(r.error.message);alert('Opening hours saved.');return;}
  if(d.xr){const wb=XLSX.utils.book_new(),f='telegant-'+d.xr+'-'+new Date().toISOString().slice(0,10)+'.xlsx';
    if(d.xr==='csat'){const x=(await sb.rpc('csat_report',{p_from:DR.f,p_to:DR.t})).data;
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{Chats:x.total,Closed:x.closed,Rated:x.rated,'Average rating':x.avg_rating,'Avg first response (s)':x.avg_frt,'Avg chat length (s)':x.avg_dur}]),'Summary');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((x.by_agent||[]).map(a=>({Agent:a.name,Chats:a.chats,Rated:a.rated,'Avg rating':a.avg,'Avg first response (s)':a.frt}))),'By agent');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((x.by_day||[]).map(a=>({Day:a.day,Chats:a.chats,'Avg rating':a.avg}))),'By day');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((x.recent||[]).map(a=>({'Chat no.':a.code,Customer:a.customer,Rating:a.rating,Comment:a.feedback,Agent:a.agent,Closed:a.at}))),'Comments');}
    else{const x=(await sb.rpc('agent_report',{p_from:DR.f,p_to:DR.t})).data;
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((x.agents||[]).map(a=>({Agent:a.name,Role:a.role,'Now':a.status,'First login':a.first_login,'Last logout':a.last_logout,'Online (min)':Math.round(a.online_s/60),'Available (min)':Math.round(a.available_s/60),'On break (min)':Math.round(a.break_s/60),Breaks:a.breaks,Chats:a.chats,'Avg rating':a.avg_rating}))),'Agents');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((x.breaks||[]).map(a=>({Agent:a.name,'Break started':a.start,'Break ended':a.end,'Minutes':Math.round(a.secs/60)}))),'Breaks');
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet((x.logins||[]).map(a=>({Agent:a.name,'Logged in':a.in,'Logged out':a.out,'Minutes':Math.round(a.secs/60)}))),'Logins');}
    XLSX.writeFile(wb,f);return;}
  if(t.id==='saveIP'){const r=await sb.from('site_settings').upsert({key:'instapay',value:{handle:$('#ipv').value.trim()}});if(r.error)return alert(r.error.message);return alert('Saved. Customers will see this account when they choose InstaPay.');}
  if(d.pf){const r=await sb.storage.from('payment-proofs').createSignedUrl(d.pf,120);if(r.error)return alert(r.error.message);window.open(r.data.signedUrl,'_blank');return;}
  if(t.id==='applyS'){SR.f=$('#sf').value;SR.t=$('#stt').value;return show('Accounting');}
  if(t.id==='clearS'){SR.f=SR.t='';return show('Accounting');}
  if(d.cp&&confirm('Confirm that the InstaPay transfer for this order has arrived? The manufacturer will then see the order.')){const r=await sb.rpc('confirm_payment',{p_order:+d.cp});if(!r.error)sb.functions.invoke('swift-action',{body:{action:'payment',order_id:+d.cp}});return done(r);}
  if(d.xl==='statement'){const rows=await statement(),os=await all('orders',q=>q.eq('status','delivered')),ls=await all('ledger'),wb=XLSX.utils.book_new(),items=[];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.map(r=>({Date:r.date,Reference:r.ref,Type:r.type,Description:r.desc,'Money out':r.debit||'','Money in':r.credit||'',Balance:r.bal}))),'Statement');
    os.forEach(o=>(Array.isArray(o.items)?o.items:[]).forEach(x=>{const dd=x.sizeDetail||{};items.push({Order:o.order_number,Delivered:String(o.delivered_at||o.created_at).slice(0,10),Customer:o.customer_name,Phone:o.phone,Item:x.name||x.color,Size:x.size==='Custom'?`Custom chest ${dd.chest} / length ${dd.length} / shoulder ${dd.shoulder}`:x.size,Qty:x.qty,'Unit price':x.price,'Line total':(x.qty||1)*(x.price||0),'Express fee (order)':o.delivery_fee,'Payment method':PM[o.payment_method]||o.payment_method,'Order total':o.total});}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(items),'Order details');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ls.map(l=>({Date:l.entry_date,Type:l.kind,Category:l.category,Supplier:l.supplier,Description:l.description,Amount:l.amount}))),'Purchases & expenses');
    XLSX.writeFile(wb,'telegant-statement-'+new Date().toISOString().slice(0,10)+'.xlsx');return;}
  if(t.id==='addL')return done(await sb.from('ledger').insert({entry_date:$('#ld').value,kind:$('#lk').value,category:$('#lc').value||null,supplier:$('#ls').value||null,description:$('#lx').value||null,amount:+$('#la').value||0}));
  if(d.ld&&confirm('Delete this entry?'))return done(await sb.from('ledger').delete().eq('id',d.ld));
  if(d.xl){let data;
    if(d.xl==='sales')data=(await all('orders')).map(o=>({Order:o.order_number,Placed:o.created_at,Delivered:o.delivered_at||'',Customer:o.customer_name,Phone:o.phone,Email:o.email,Address:o.address,Items:itemParts(o.items).join('; '),Subtotal:o.subtotal,Express:o.express?'Yes':'No','Delivery fee':o.delivery_fee,Total:o.total,'Payment method':PM[o.payment_method]||o.payment_method,'Payment status':o.payment_status,Status:o.status}));
    else if(d.xl==='ledger')data=(await all('ledger')).map(r=>({Date:r.entry_date,Type:r.kind,Category:r.category,Supplier:r.supplier,Description:r.description,Amount:r.amount}));
    else data=((await sb.from('accounting_monthly').select('*').order('m')).data||[]).map(r=>({Month:String(r.m).slice(0,7),Revenue:r.revenue,Costs:r.costs,Profit:r.revenue-r.costs}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),d.xl);XLSX.writeFile(wb,'telegant-'+d.xl+'-'+new Date().toISOString().slice(0,10)+'.xlsx');return;}
  if(t.id==='addU'){const r=await sb.functions.invoke('admin-users',{body:{action:'create',email:$('#ue').value.trim(),password:$('#up').value,role:$('#ur').value}});
    return done(r.error||r.data?.error?{error:r.data?.error||r.error.message}:null);}
  if(d.ap)return done(await sb.from('profiles').update({status:'approved'}).eq('id',d.ap));
  if(d.rj)return done(await sb.from('profiles').update({status:'rejected'}).eq('id',d.rj));
  if(d.del&&confirm('Remove this user permanently?')){const r=await sb.functions.invoke('admin-users',{body:{action:'delete',id:d.del}});
    return done(r.error||r.data?.error?{error:r.data?.error||r.error.message}:null);}
  if(t.id==='addP'){const nm=$('#pn').value.trim();if(!nm||!$('#pp').value)return alert('Name and price are required.');
    const row={name_en:nm,name_ar:$('#pa').value||null,price:+$('#pp').value,stock:parseInt($('#ps').value)||0,image_url:$('#pi').value||null,category_id:$('#pc').value||null,slug:slug(nm)};
    let r=await sb.from('products').insert(row);if(r.error&&r.error.code==='23505'){row.slug+='-'+Math.floor(Math.random()*900+100);r=await sb.from('products').insert(row);}
    if(!r.error)await sb.from('pages').insert({slug:'p-'+row.slug,title:nm,kind:'product',target:row.slug});
    return done(r);}
  if(t.id==='assignC'){const ids=[...document.querySelectorAll('input[name=ap]:checked')].map(x=>+x.value);
    if(!ids.length)return alert('Tick at least one product.');return done(await sb.from('products').update({category_id:+$('#ac').value}).in('id',ids));}
  if(t.id==='addC'){const nm=$('#cn').value.trim();if(!nm)return alert('Enter a name.');
    const row={name_en:nm,name_ar:$('#ca').value||null,parent_id:$('#cp').value||null,slug:slug(nm)};
    let r=await sb.from('categories').insert(row);if(r.error&&r.error.code==='23505'){row.slug+='-'+Math.floor(Math.random()*900+100);r=await sb.from('categories').insert(row);}
    if(!r.error)await sb.from('pages').insert({slug:'c-'+row.slug,title:nm,kind:'category',target:row.slug});
    return done(r);}
  if(d.ca){const[i,v]=d.ca.split('|');return done(await sb.from('categories').update({active:v==='1'}).eq('id',i));}
  if(d.cd&&confirm('Delete this category (and its sub-categories)? Products stay, but lose the category.')){
    const c=(await sb.from('categories').select('slug').eq('id',d.cd).single()).data;const r=await sb.from('categories').delete().eq('id',d.cd);
    if(!r.error&&c)await sb.from('pages').delete().eq('slug','c-'+c.slug);return done(r);}
  if(t.id==='addPg'){const ti=$('#gt').value.trim();if(!ti)return alert('Enter a title.');
    return done(await sb.from('pages').insert({slug:slug(ti),title:ti,kind:'custom',content:$('#gc').value}));}
  if(d.pg){const[i,v]=d.pg.split('|');return done(await sb.from('pages').update({published:v==='1'}).eq('id',i));}
  if(d.pgd&&confirm('Delete this page?'))return done(await sb.from('pages').delete().eq('id',d.pgd));
  if('pu' in d){const tr=t.closest('tr'),id=t.parentElement.dataset.pid;
    const price=+val(tr,'price'),sale=val(tr,'sale')===''?null:+val(tr,'sale');
    if(sale!==null&&sale>=price)return alert('Offer price must be lower than the normal price.');
    const upd={price,category_id:val(tr,'cat')||null,stock:parseInt(val(tr,'stock'))||0,sale_price:sale,offer_label:sale===null?null:(val(tr,'label')||null),offer_ends_at:sale===null?null:(val(tr,'ends')||null)};
    const f=tr.querySelector('[name=file]').files[0];
    if(f){const path=`${id}-${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
      const u=await sb.storage.from('product-images').upload(path,f);if(u.error)return alert(u.error.message);
      upd.image_url=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;}
    return done(await sb.from('products').update(upd).eq('id',id));}
  if('ro' in d)return done(await sb.from('products').update({sale_price:null,offer_label:null,offer_ends_at:null}).eq('id',t.parentElement.dataset.pid));
  if(d.pr!==undefined)return done(await sb.from('products').update({archived:d.pr==='1'}).eq('id',t.parentElement.dataset.pid));
  if(t.id==='addR')return done(await sb.from('reviews').insert({kind:'review',author:$('#ra').value,rating:+$('#rr').value||null,body:$('#rb').value,visible:true}));
  if(d.rv){const[i,v]=d.rv.split('|');return done(await sb.from('reviews').update({visible:v==='1'}).eq('id',i));}
  if(d.rd&&confirm('Delete this?'))return done(await sb.from('reviews').delete().eq('id',d.rd));});

(async()=>{me=await TG.profile();
  if(!me||me.role!=='owner'||me.status!=='approved'){location.replace('login.html');return;}

  $('#nav').innerHTML=Object.keys(TABS).map(n=>`<button>${n}</button>`).join('');
