<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Chat console | TELEGANT</title>
<script>try{var t=localStorage.tg_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="tg-theme.css">
<style>
:root{--ink:#2a2114;--card:rgba(255,252,244,.9);--line:rgba(160,120,40,.3);--gold:#b8892f}
html[data-tg-theme=dark]{--ink:#f1e9d6;--card:rgba(24,19,12,.9);--line:rgba(232,207,134,.25);--gold:#e8cf86}
body{margin:0;font:14px/1.5 system-ui,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font:600 18px Georgia,serif;flex:1}
button,select,input{font:inherit;color:var(--ink)}
.b{padding:7px 12px;border:1px solid var(--line);background:none;border-radius:8px;cursor:pointer}.p{background:var(--gold);color:#16110a;border-color:var(--gold);font-weight:600}
main{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:14px;max-width:1100px;margin:0 auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
#list{max-height:70vh;overflow-y:auto}#list div{padding:8px;border-bottom:1px solid var(--line);cursor:pointer}#list div.on{background:rgba(201,162,75,.18)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--gold);color:var(--gold)}
#msgs{height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px}
.m{max-width:75%;padding:7px 11px;border-radius:12px;word-break:break-word}.cu{align-self:flex-start;background:rgba(160,120,40,.2)}.st{align-self:flex-end;background:var(--gold);color:#16110a}.sy{align-self:center;font-size:12px;opacity:.7}
input,select{padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}.row input[type=text]{flex:1;min-width:160px}
</style></head><body>
<header><img src="MEBG-GOLDEN.png" alt="TELEGANT" style="height:40px"><b>Chat console</b>
<button class="b" id="tg" style="display:none"></button><button class="b" id="xl" style="display:none">Export (.xlsx)</button>
<a class="b" id="ad" href="admin.html" style="display:none;text-decoration:none;color:var(--ink)">Admin</a>
<button class="b" id="th">Light / dark</button><button class="b" id="out">Sign out</button></header>
<main><div class="card"><select id="f"><option value="active">Active chats</option><option value="mine">Mine</option><option value="closed">Closed</option><option value="all">All</option></select><div id="list"></div></div>
<div class="card" id="conv">Pick a chat on the left.</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="tg-core.js"></script>
<script>
const sb=TG.sb,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me,chats=[],sel=+new URLSearchParams(location.search).get('c')||null,staff=[],key='',chatOn=false;
const err=r=>{if(r&&r.error){alert(r.error.message);return true;}};
async function setChatBtn(){const r=await sb.from('site_settings').select('value').eq('key','chat_enabled').maybeSingle();chatOn=!!(r.data&&r.data.value.on);$('#tg').textContent='Chat widget: '+(chatOn?'ON':'OFF');$('#tg').classList.toggle('p',chatOn);}
async function list(){chats=(await sb.from('chats').select('*').order('id',{ascending:false}).limit(300)).data||[];
  const f=$('#f').value,v=chats.filter(c=>f==='all'||(f==='active'&&c.status!=='closed')||(f==='closed'&&c.status==='closed')||(f==='mine'&&c.claimed_by===me.id));
  $('#list').innerHTML=v.map(c=>`<div data-c="${c.id}" class="${c.id===sel?'on':''}"><b>#${c.id} ${esc(c.customer_name)}</b> <span class="tag">${c.status==='claimed'?esc(c.claimed_name):c.status}</span><br><small>${new Date(c.created_at).toLocaleString()}${c.rating?' · '+'★'.repeat(c.rating):''}</small></div>`).join('')||'<small>No chats.</small>';
  if(sel)await conv();}
async function conv(){const c=chats.find(x=>x.id===sel);if(!c)return;
  const k=c.id+c.status+c.claimed_by;
  if(k!==key){key=k;const mine=c.claimed_by===me.id,open=c.status!=='closed';
    $('#conv').innerHTML=`<b>#${c.id} ${esc(c.customer_name)}</b> <small>${esc(c.customer_email||'')}</small> <span class="tag">${c.status==='claimed'?'taken by '+esc(c.claimed_name):c.status}</span>
     <div id="msgs"></div>`+(c.status==='open'?`<button class="b p" id="take">Take this chat</button>`:
     c.status==='closed'?`<p>Closed ${c.closed_at?new Date(c.closed_at).toLocaleString():''}. Rating: ${c.rating?'★'.repeat(c.rating):'not yet'}${c.feedback?' – '+esc(c.feedback):''}</p>`:
     mine?`<div class="row"><input type="text" id="re" placeholder="Reply…" maxlength="500"><button class="b p" id="snd">Send</button></div>
       <div class="row"><select id="to">${staff.filter(s=>s.id!==me.id).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="b" id="tr">Transfer</button><button class="b" id="cl">Close chat</button></div>`:
     `<p>Only ${esc(c.claimed_name)} can reply to this chat.</p>`+(me.role==='owner'?`<button class="b" id="take">Take over</button> <button class="b" id="cl">Close chat</button>`:''));}
  const m=(await sb.from('chat_messages').select('*').eq('chat_id',c.id).order('id')).data||[],box=$('#msgs');
  box.innerHTML=m.map(x=>`<div class="m ${x.sender_role==='customer'?'cu':x.sender_role==='staff'?'st':'sy'}">${esc(x.body)}</div>`).join('');box.scrollTop=box.scrollHeight;}
$('#list').onclick=e=>{const d=e.target.closest('[data-c]');if(!d)return;sel=+d.dataset.c;key='';list();};
$('#f').onchange=list;
$('#conv').onclick=async e=>{const i=e.target.id,c=chats.find(x=>x.id===sel);if(!c||!['take','snd','tr','cl'].includes(i))return;
  if(i==='take'){if(err(await sb.rpc('chat_claim',{p_chat:c.id})))return;}
  if(i==='snd'||false){const v=$('#re').value.trim();if(!v)return;$('#re').value='';if(err(await sb.rpc('chat_send',{p_chat:c.id,p_body:v,p_as:'staff'})))return;}
  if(i==='tr'){if(err(await sb.rpc('chat_transfer',{p_chat:c.id,p_to:$('#to').value})))return;}
  if(i==='cl'&&confirm('Close this chat? The customer gets a survey email.')){if(err(await sb.rpc('chat_close',{p_chat:c.id})))return;sb.functions.invoke('swift-action',{body:{action:'chat_close',chat_id:c.id}});}
  key='';list();};
$('#conv').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='re')$('#snd').click();});
$('#tg').onclick=async()=>{const r=await sb.from('site_settings').upsert({key:'chat_enabled',value:{on:!chatOn}});if(!err(r))setChatBtn();};
async function all(t){let o=[],i=0;for(;;){const{data}=await sb.from(t).select('*').order('id').range(i,i+999);o=o.concat(data||[]);if(!data||data.length<1000)return o;i+=1000;}}
$('#xl').onclick=async()=>{const[c,m]=await Promise.all([all('chats'),all('chat_messages')]),nm={};c.forEach(x=>nm[x.id]=x.customer_name);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(c.map(x=>({Chat:x.id,Customer:x.customer_name,Email:x.customer_email,Status:x.status,'Handled by':x.claimed_name,Started:x.created_at,Closed:x.closed_at,Rating:x.rating,Feedback:x.feedback}))),'Chats');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(m.map(x=>({Chat:x.chat_id,Customer:nm[x.chat_id],Time:x.created_at,From:x.sender_role,Name:x.sender_name,Message:x.body}))),'Messages');
  XLSX.writeFile(wb,'telegant-chats-'+new Date().toISOString().slice(0,10)+'.xlsx');};
$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.tg_theme=n};
$('#out').onclick=async()=>{await TG.signOut();location.href='login.html'};
(async()=>{me=await TG.profile();
  if(!me||me.status!=='approved'||!['owner','support'].includes(me.role)){location.replace('login.html?next=chat-admin.html');return;}
  staff=(await sb.rpc('staff_list')).data||[];
  if(me.role==='owner'){$('#tg').style.display=$('#xl').style.display=$('#ad').style.display='';setChatBtn();}
  list();setInterval(list,4000);})();
</script></body></html>
