<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Orders | TELEGANT</title>
<script>try{var t=localStorage.tg_theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="tg-theme.css">
<style>
:root{--ink:#2a2114;--card:rgba(255,252,244,.88);--line:rgba(160,120,40,.3);--gold:#b8892f}
html[data-tg-theme=dark]{--ink:#f1e9d6;--card:rgba(24,19,12,.88);--line:rgba(232,207,134,.25);--gold:#e8cf86}
body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header b{font:600 18px Georgia,serif;flex:1}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h3{margin:0 0 6px;font:600 17px Georgia,serif}
select,input,button{font:inherit;color:var(--ink)}
select,input[type=text]{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;margin:8px 0}
.b{padding:10px 14px;border:1px solid var(--line);background:none;border-radius:8px;cursor:pointer}
.p{background:var(--gold);color:#16110a;border-color:var(--gold);font-weight:600}
small{opacity:.8}a{color:var(--gold)}
</style></head><body>
<header><img src="MEBG-GOLDEN.png" alt="TELEGANT" style="height:40px"><b id="ttl">Orders</b>
<button class="b" id="th">Light / dark</button><button class="b" id="out">Sign out</button></header>
<main id="v">Loading…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="tg-core.js"></script><script src="tg-ui.js"></script>
<script>
const $=s=>document.querySelector(s),sb=TG.sb;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=['obtaining material','cutting','assembling','adding product photo','ready for pickup'];
const D=['on the way to manufacturer','picked up','on the way to customer'];
let me,rows=[];
const items=a=>(Array.isArray(a)?a:[]).map(x=>esc(Object.entries(x||{}).filter(([k,v])=>v!==''&&v!=null&&!/img|image|price/i.test(k)).map(([k,v])=>k+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · '))).join('<br>');
async function load(){const r=await sb.rpc('staff_orders');if(r.error){$('#v').textContent=r.error.message;return;}rows=r.data;render();}
function opts(list,cur,first){return (first?`<option value="" disabled${list.includes(cur)?'':' selected'}>${esc(cur)}</option>`:'')+list.map(s=>`<option${s===cur?' selected':''}>${s}</option>`).join('');}
function render(){
  $('#v').innerHTML=rows.map(o=>me.role==='manufacturer'?`<div class="card"><h3>${esc(o.order_number)}</h3>
    <div>${items(o.items)}</div><small>Deliver by: ${esc(o.delivery_date||'-')}</small>
    <select data-st="${o.id}">${opts(M,o.status,1)}</select>
    ${o.status==='adding product photo'||o.product_photo?`<div>${o.product_photo?`<img src="${esc(o.product_photo)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:8px">`:''}
      <small>Product photo (required before "ready for pickup")</small><input type="file" accept="image/*" data-ph="${o.id}"></div>`:''}</div>`
    :`<div class="card"><h3>${esc(o.order_number)}</h3><div>${esc(o.customer_name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div>
    <div>${esc(o.address)}</div><small>${esc(o.payment_method)} · ${esc(o.total)} EGP · deliver by ${esc(o.delivery_date||'-')}</small>
    ${o.status==='arrived at customer'?`<input type="text" inputmode="numeric" maxlength="6" placeholder="Customer's 6-digit code" id="c${o.id}"><button class="b p" data-cf="${o.id}">Confirm delivery</button>`
    :`<select data-st="${o.id}">${opts(D,o.status,1)}</select>`+(o.status==='on the way to customer'?`<button class="b p" data-arr="${o.id}">I'm at the customer – send code</button>`:'')}</div>`
  ).join('')||'<div class="card">No orders right now.</div>';}
const fail=e=>alert(e.message||e);
$('#v').addEventListener('change',async e=>{const t=e.target;
  if(t.dataset.st){const r=await sb.rpc('set_order_status',{p_order:+t.dataset.st,p_status:t.value});if(r.error)fail(r.error);else sb.functions.invoke('swift-action',{body:{action:'status',order_id:+t.dataset.st}});load();}
  if(t.dataset.ph&&t.files[0]){const f=t.files[0],path=`${t.dataset.ph}-${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
    const u=await sb.storage.from('order-photos').upload(path,f);if(u.error)return fail(u.error);
    const r=await sb.rpc('set_order_photo',{p_order:+t.dataset.ph,p_url:sb.storage.from('order-photos').getPublicUrl(path).data.publicUrl});if(r.error)fail(r.error);load();}});
$('#v').addEventListener('click',async e=>{const d=e.target.dataset;
  if(d.arr){e.target.disabled=true;const r=await sb.functions.invoke('swift-action',{body:{action:'code',order_id:+d.arr}});
    const er=r.data?.error||r.error?.message;if(er)fail(er);else alert(r.data.emailed?'Code sent to the customer by email.':'Customer has no email on file – ask the owner.');load();}
  if(d.cf){const r=await sb.rpc('confirm_delivery',{p_order:+d.cf,p_code:$('#c'+d.cf).value});
    if(r.error)return fail(r.error);if(r.data==='ok')sb.functions.invoke('swift-action',{body:{action:'status',order_id:+d.cf}});alert({ok:'Delivered ✔',wrong:'Wrong code.',locked:'Too many wrong tries – contact the owner.'}[r.data]);load();}});
$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.tg_theme=n};
$('#out').onclick=async()=>{await TG.signOut();location.href='login.html'};
(async()=>{me=await TG.profile();
  if(!me||me.status!=='approved'){location.replace('login.html');return;}
  if(me.role==='owner'){location.replace('admin.html');return;}
  if(!['manufacturer','delivery'].includes(me.role)){location.replace('index.html');return;}
  $('#ttl').textContent=me.role==='manufacturer'?'Manufacturing':'Deliveries';load();})();
</script></body></html>
